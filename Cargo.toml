[package]
name = "cxm"
version = "0.6.3"
edition = "2021"
authors = ["Praveensenpai"]
description = "Codex Account Manager & Switcher CLI"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inquire = "0.7"
base64 = "0.22"
colored = "2.1"
anyhow = "1.0"
dirs = "5.0"
ureq = { version = "2.9", features = ["json"] }
chrono = "0.4"
crossterm = "0.28"
ratatui = "0.29"
